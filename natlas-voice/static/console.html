<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Human agent console</title>
<style>
  :root { --bg:#fff; --fg:#1b1b1b; --muted:#666; --card:#f4f5f7; --line:#dcdfe4; --warn:#b4540a; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14161a; --fg:#eceef1; --muted:#9aa0a9; --card:#1e2127; --line:#2f343c; --warn:#f0a35e; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, sans-serif; }
  main { max-width:900px; margin:0 auto; padding:20px 16px 40px; }
  h1 { font-size:1.3rem; margin:0 0 4px; } .sub { color:var(--muted); font-size:.9rem; margin:0 0 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:12px; }
  .tag { color:var(--warn); border:1px solid var(--warn); border-radius:99px; padding:1px 10px; font-size:.8rem; }
  pre { white-space:pre-wrap; margin:8px 0 0; font:inherit; font-size:.92rem; }
</style>
</head>
<body>
<main>
  <h1>Human agent console</h1>
  <p class="sub">Escalated calls appear here with a summary, so the caller never repeats themselves. Refreshes every 4 seconds.</p>
  <div id="list"><p class="sub">No escalated calls yet.</p></div>
</main>
<script>
async function load() {
  try {
    const items = await (await fetch("/api/handoffs")).json();
    const list = document.getElementById("list");
    if (!items.length) { list.innerHTML = '<p class="sub">No escalated calls yet.</p>'; return; }
    list.innerHTML = "";
    for (const it of items) {
      const c = document.createElement("div"); c.className = "card";
      const h = document.createElement("div");
      const t = document.createElement("span"); t.className = "tag"; t.textContent = it.reason;
      const s = document.createElement("strong"); s.textContent = " " + it.ref;
      h.append(t, s);
      const p = document.createElement("pre"); p.textContent = it.summary;
      c.append(h, p); list.appendChild(c);
    }
  } catch (e) {}
}
load(); setInterval(load, 4000);
</script>
</body>
</html>
